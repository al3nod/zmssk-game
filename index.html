<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ازرع أثراً جميلاً</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg1:#0b1d2a;--bg2:#143a4a;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--acc:#3ddc97;--acc2:#7cf5c4;--gold:#ffd166;--warn:#ff6b6b;--tx:#eef6f2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--tx);background:radial-gradient(circle at 15% 0%,#1f5a55,transparent 50%),linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{font:inherit;font-size:20px;padding:12px 18px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:#fff;width:min(340px,88vw);text-align:center;outline:none;user-select:text}
input:focus{border-color:var(--acc)}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;overflow:auto}
h1{font-size:clamp(34px,6vw,62px);font-weight:900;background:linear-gradient(90deg,var(--acc2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.sub{font-size:20px;opacity:.9;max-width:640px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 22px;max-width:680px;line-height:1.8;font-size:17px}
.note{font-size:14px;opacity:.8}
.btn{font:inherit;font-weight:900;font-size:17px;padding:10px 18px;border-radius:14px;border:0;cursor:pointer;color:#06231a;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 20px rgba(0,0,0,.35)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#langBtn{position:fixed;top:12px;inset-inline-end:12px;z-index:50;font-size:14px;padding:8px 14px}
#game{position:fixed;inset:0;display:flex;flex-direction:column}
.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding:8px;background:rgba(0,0,0,.35)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 12px;font-weight:700;font-size:15px}
.chip b{color:var(--acc2);font-size:19px;margin-inline-start:4px}
.hud .btn{font-size:14px;padding:6px 12px}
.main{flex:1;position:relative;min-height:0}
.stage{position:absolute;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;touch-action:none}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:8px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:6}
#toast.on{opacity:1}
#shop{position:absolute;top:38%;right:10px;width:190px;background:rgba(10,22,32,.94);border:2px solid var(--gold);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:4}
#shop h3{color:var(--gold);font-size:14px}
.item{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.item .btn{font-size:12px;padding:4px 8px}
#panel{position:absolute;top:10px;left:10px;z-index:4;width:210px;max-height:60%;overflow:auto;background:rgba(10,22,32,.85);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
ul{list-style:none;display:flex;flex-direction:column;gap:6px}
li{background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px}
#inv{display:flex;flex-direction:column;gap:6px}
#inv .btn{font-size:13px;padding:7px 10px;text-align:start}
#joy{position:absolute;left:16px;bottom:16px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid var(--line);display:none;align-items:center;justify-content:center;touch-action:none;z-index:5}
#knob{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));pointer-events:none}
#act{position:absolute;right:18px;bottom:18px;width:96px;height:96px;border-radius:50%;border:0;font-size:38px;background:linear-gradient(135deg,var(--gold),#ffb347);display:none;touch-action:none;z-index:5}
#game.joy #joy,#game.joy #act{display:flex}
#skipT{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:5px;border:1px solid rgba(255,255,255,.12);background:#000;opacity:.4;z-index:7;cursor:pointer;padding:0}
#skipT:hover{opacity:.9}
#certImg{max-width:min(760px,92vw);border-radius:14px}
@media (pointer:coarse){.card{font-size:12px;padding:8px 12px}#panel{width:170px}.hud .btn,.chip{font-size:12px}#joy{width:120px;height:120px}}
@media print{html,body{height:auto;overflow:visible;background:#fff}body>*{display:none!important}#printArea{display:block!important;position:static}#printArea img{width:100%}@page{size:A4 landscape;margin:0}}
</style>
</head>
<body>
<button id="langBtn" class="btn ghost" onclick="toggleLang()"></button>

<section id="start" class="screen">
 <h1 data-k="title"></h1>
 <p class="sub" data-k="sub"></p>
 <input id="name" maxlength="30" autocomplete="off">
 <div class="row">
  <button class="btn" id="st1" data-k="st1" onclick="begin(1)"></button>
  <button class="btn hidden" id="st2" data-k="st2" onclick="begin(2)"></button>
  <button class="btn hidden" id="st3" data-k="st3" onclick="begin(3)"></button>
  <button class="btn hidden" id="st4" data-k="st4" onclick="begin(4)"></button>
 </div>
 <div class="card" data-k="howto"></div>
</section>

<section id="game" class="hidden">
 <div class="hud">
  <div class="chip"><span data-k="lvl"></span><b id="lvl"></b></div>
  <div class="chip"><span data-k="pts"></span><b id="pts"></b></div>
  <div class="chip"><span data-k="time"></span><b id="tl"></b></div>
  <div class="chip"><span data-k="lives"></span><b id="lives"></b></div>
  <button class="btn ghost" id="modeBtn" onclick="toggleMode()"></button>
  <button class="btn ghost" data-k="home" onclick="goHome()"></button>
  <button class="btn ghost" onclick="toggleFS()">⛶</button>
 </div>
 <div class="main">
  <div class="stage">
   <canvas id="cv" width="960" height="600"></canvas>
   <div id="toast"></div>
   <div id="shop" class="hidden"></div>
   <div id="panel"><ul id="tasks"></ul><div id="inv"></div></div>
   <div id="joy"><div id="knob"></div></div>
   <button id="act"></button>
   <button id="skipT" title="تخطي المهمة" onclick="skipTask()"></button>
  </div>
 </div>
</section>

<section id="end" class="screen hidden">
 <h1 id="endTitle"></h1>
 <p class="sub" id="endMsg"></p>
 <img id="certImg" alt="">
 <p class="note" id="dlMsg"></p>
 <div class="row">
  <button class="btn" data-k="dl" onclick="download()"></button>
  <button class="btn ghost" id="next" data-k="next" onclick="nextRun()"></button>
  <button class="btn ghost" data-k="rep" onclick="replay()"></button>
  <button class="btn ghost" data-k="all" onclick="restartAll()"></button>
  <button class="btn ghost" data-k="home" onclick="goHome()"></button>
 </div>
</section>
<div id="printArea" class="hidden"><img id="printImg" alt=""></div>

function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('hidden',s!==id));$('langBtn').classList.toggle('hidden',id==='game');if(id==='start')refreshStart()}
function refreshStart(){const top=Math.max(0,...[1,2,3,4].filter(n=>RES[n]));for(let n=1;n<=4;n++)$('st'+n).classList.toggle('hidden',n>top+1)}
function nextStage(){for(let n=1;n<=4;n++)if(!RES[n])return n;return 0}
function nextRun(){const n=nextStage();if(n)begin(n)}
function toast(m,ok){const e=$('toast');e.textContent=m;e.style.color=ok?'#7cf5c4':'#ff8a8a';e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1600)}
function enterFS(){const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(f)try{Promise.resolve(f.call(e)).catch(()=>{})}catch(_){}}
function toggleFS(){document.fullscreenElement?document.exitFullscreen().catch(()=>{}):enterFS()}

const cap=()=>WAL.carry?2:1;

// ---------- run lifecycle ----------
function newRun(part){
 resetInput();
 const g={part,total:0,over:null,boost:0,cine:null,walk:false,p:{x:480,y:420,hold:[]},items:[],visited:false,
  round:0,sorted:0,strikes:0,sap:[],built:0,talk:false,well:false,dig:0,dig2:0,pond:false,
  cleaned:0,need:0,tr:[],anims:[],fz:0,fzI:-1,endT:null,ret:null,fin:null,npcs:null};
 if(part===1)for(let i=0;i<15;i++)g.items.push({...TYPES[Math.floor(Math.random()*4)],x:rnd(60,780),y:rnd(80,380)});
 if(part===2){g.need=10;g.items=scatter(10,TREES.concat([FBIN]),75,150,560,['🥫','🛍️','🍾','🥤','📦','🧴']);g.tr=TREES.map(()=>false)}

 return g;
}
function scatter(n,avoid,minD,y0,y1,emos){
 const out=[];let tries=0;
 while(out.length<n&&tries<3000){
  tries++;const x=rnd(50,910),y=rnd(y0,y1);
  if(avoid.every(a=>dist(x,y,a.x,a.y)>minD)&&out.every(o=>dist(x,y,o.x,o.y)>50))out.push({e:emos[out.length%emos.length],x,y});
 }
 return out;
}
function begin(part){
 const n=$('name').value.trim()||name;
 if(!n){$('name').focus();return}
 name=n;G=newRun(part);running=true;
 if(isTouch)enterFS();
 show('game');
 $('shop').classList.add('hidden');
 $('game').classList.toggle('joy',mode==='joy');
 renderInv();
}
function replay(){if(G)begin(G.part)}
function goHome(){running=false;G=null;resetInput();show('start');$('name').value=name}
function restartAll(){RES={};WAL={pts:0,inv:{speed:0},carry:false};goHome()}
function finish(win){
 const g=G;g.over=win?'win':'lost';running=false;resetInput();
 if(win)RES[g.part]={t:g.total};
 show('end');showEnd();
}
function showEnd(){
 const g=G,w=g.over==='win';
 $('endTitle').textContent=T(w?'win':'lost');
 $('endMsg').textContent=`${name} • ${T('pts')}: ${WAL.pts} • ${T('time')}: ${fmt(g.total)}`;
 $('next').classList.toggle('hidden',!(w&&nextStage()));
 const has=Object.keys(RES).length>0;
 $('certImg').classList.toggle('hidden',!has);
 const url=makeCert().toDataURL('image/png');
 $('certImg').src=url;$('printImg').src=url;
}
function makeCert(){
 const c=document.createElement('canvas');c.width=1200;c.height=850;
 const x=c.getContext('2d'),ar=lang==='ar';

 o.x+=dx/d*s;o.y+=dy/d*s;return false;
}

  if(it&&p.hold.length<cap()){g.items.splice(g.items.indexOf(it),1);p.hold.push(it);return}
  if(p.hold.length)dropHere();
 }else if(R===1){
  const j=SPOTS6.findIndex((s,n)=>dist(p.x,p.y,s.x,s.y)<60&&!g.sap.some(z=>z.i===n));
  if(j>=0){g.sap.push({i:j,w:false,g:0,gr:false});WAL.pts+=10;toast(T('planted'),1);if(g.sap.length===6)g.round=2}
 }else if(R===2){
  const z=g.sap.find(v=>!v.w&&dist(p.x,p.y,SPOTS6[v.i].x,SPOTS6[v.i].y)<60);

 }

}
function dropHere(){const g=G,h=g.p.hold.pop();h.x=g.p.x;h.y=g.p.y+18;g.items.push(h)}

function actF(){
 const g=G;
 if(g.round===0)cleanAct(g,FBIN);
}
function makeAnim(i){
 const t=TREES[i],A=ANIM[i],left=t.x<480,ex=left?-60:1020;
 let wp,spd;
 if(A.k==='climb'){wp=[{x:ex,y:t.y+44},{x:t.x,y:t.y+44},{x:t.x,y:t.y-40}];spd=90}
 else if(A.k==='fly'){wp=[{x:ex,y:80+i*6},{x:t.x+(left?36:-36),y:t.y-10}];spd=130}
 else{wp=[{x:ex,y:t.y+44},{x:t.x+(left?52:-52),y:t.y+44}];spd=90}
 return{e:A.e,k:A.k,wp,seg:0,x:wp[0].x,y:wp[0].y,dir:1,t:0,done:false,spd};
}
function updateAnims(g,dt){
 g.anims.forEach(a=>{
  if(a.done)return;
  a.t+=dt;
  const nx=a.wp[a.seg+1];
  if(!nx){a.done=true;return}
  const dx=nx.x-a.x,dy=nx.y-a.y,d=Math.hypot(dx,dy),s=a.spd*dt;
  if(d<=s){a.x=nx.x;a.y=nx.y;a.seg++;if(a.seg>=a.wp.length-1)a.done=true}
  else{a.x+=dx/d*s;a.y+=dy/d*s;if(Math.abs(dx)>.1)a.dir=dx>0?1:-1}
 });
}
function updateF(dt){
 const g=G,p=g.p;
 g.total+=dt;
 moveP(g,dt);
 if(g.round===1){
  const i=TREES.findIndex((t,n)=>!g.tr[n]&&dist(p.x,p.y,t.x,t.y)<75);
  if(i>=0&&IN.space){
   g.fzI=i;g.fz=Math.min(1,g.fz+dt/2);
   if(g.fz>=1){g.tr[i]=true;g.fz=0;g.anims.push(makeAnim(i));WAL.pts+=10;toast(T('fert'),1)}
  }else{g.fz=0;g.fzI=-1}
 }
 updateAnims(g,dt);
 if(g.round===1&&g.anims.length===9&&g.anims.every(a=>a.done)&&g.endT==null)g.endT=0;
 if(g.endT!=null){g.endT+=dt;if(g.endT>=2.5)finish(true)}
}
function deadTree(x,y){

 cx.beginPath();cx.moveTo(x-7,y-30);cx.lineTo(x-34,y-62);cx.lineTo(x-30,y-66);cx.lineTo(x-4,y-40);cx.fill();
 cx.beginPath();cx.moveTo(x+7,y-50);cx.lineTo(x+32,y-86);cx.lineTo(x+36,y-82);cx.lineTo(x+9,y-44);cx.fill();
 cx.fillStyle='#2e3b3f';cx.beginPath();cx.arc(x-4,y+14,6,0,Math.PI*2);cx.arc(x+10,y+22,5,0,Math.PI*2);cx.fill();
}
function drawF(){

 cx.clearRect(0,0,W,H);

// ---------- desert (stage 4) ----------
function stageD(g){
 if(g.pond)return 5;
 if(g.sap.length===9&&g.sap.every(z=>z.gr))return 4;
 if(g.well)return 3;
 if(g.talk)return 2;
 if(g.sap.length===9)return 1;
 return 0;
}
function actD(){
 const g=G,p=g.p,near=(o,r)=>dist(p.x,p.y,o.x,o.y)<r;
 const free=SP9.findIndex((s,i)=>near(s,50)&&!g.sap.some(z=>z.i===i));
 if(free>=0){g.sap.push({i:free,w:false,g:0,gr:false});WAL.pts+=10;toast(T('planted'),1);return}
 if(!g.talk&&g.sap.length===9&&near(GUIDE,80)){g.talk=true;toast(T('talked'),1);return}
 if(g.well){const z=g.sap.find(v=>!v.w&&near(SP9[v.i],50));if(z){z.w=true;toast(T('watered'),1)}}
}
function actFin(){
 const f=G.fin,p=G.p;
 if(f.phase==='stop'&&dist(p.x,p.y,f.car,510)<130){f.phase='talk';f.tt=0}
}
function updateD(dt){
 const g=G,p=g.p;
 if(g.cine!=null){
  g.cine+=dt;
  if(g.cine<24){const f=clamp(g.cine/2,0,1),s=g.cS,t=g.cT;p.x=s.x+(t.x-s.x)*f;p.y=s.y+(t.y-s.y)*f;return}
  g.cine=null;g.fin={phase:'drive',car:-140,dropped:false,litter:null,carry:false,tt:0,n:null};
  return;
 }
 if(g.fin){updateFin(dt);return}
 g.total+=dt;
 moveP(g,dt);
 g.sap.forEach(z=>{if(z.w&&!z.gr){z.g+=dt;if(z.g>=3){z.gr=true;WAL.pts+=10}}});
 if(g.talk&&!g.well&&IN.space&&dist(p.x,p.y,HOLE.x,HOLE.y)<50){
  g.dig=Math.min(1,g.dig+dt/5);
  if(g.dig>=1){g.well=true;WAL.pts+=20;toast(T('well'),1)}
 }
 if(stageD(g)===4&&IN.space&&dist(p.x,p.y,POND.x,POND.y)<55){
  g.dig2=Math.min(1,g.dig2+dt/7);
  if(g.dig2>=1){g.pond=true;WAL.pts+=50;g.cine=0;g.cS={x:p.x,y:p.y};g.cT={x:TENT.x-150,y:TENT.y+15};toast(T('pond'),1)}
 }
}
function updateFin(dt){
 const g=G,f=g.fin;
 g.total+=dt;
 moveP(g,dt);
 f.tt+=dt;
 if(f.phase==='drive'){
  f.car+=120*dt;
  if(!f.dropped&&f.car>=300){f.dropped=true;f.litter={x:f.car-60,y:522,e:'🥤'}}
  if(f.car>=560){f.car=560;f.phase='stop';f.tt=0}
 }else if(f.phase==='talk'){
  if(f.tt>=5.4){f.phase='npc_go';f.tt=0;f.n={x:476,y:422}}
 }else if(f.phase==='npc_go'){
  if(stepTo(f.n,f.litter.x,522,150*dt)){f.phase='npc_pick';f.tt=0;f.carry=true}
 }else if(f.phase==='npc_pick'){
  if(f.tt>=1){f.phase='npc_bin';f.tt=0}
 }else if(f.phase==='npc_bin'){
  if(stepTo(f.n,BIN2.x,440,150*dt)){f.phase='end';f.tt=0;f.carry=false;f.litter=null}
 }else if(f.phase==='end'){
  if(f.tt>=1.5)finish(true);
 }
}
function drawCar(x,y){
 cx.fillStyle='#c0392b';cx.fillRect(x-55,y-22,110,34);cx.fillRect(x-30,y-42,60,22);
 cx.fillStyle='#bfe6ff';cx.fillRect(x-24,y-38,22,16);cx.fillRect(x+4,y-38,22,16);
 cx.fillStyle='#111';cx.beginPath();cx.arc(x-32,y+14,11,0,Math.PI*2);cx.arc(x+32,y+14,11,0,Math.PI*2);cx.fill();
}
function drawFin(){
 const f=G.fin,p=G.p;
 emo('🗑️',BIN2.x,BIN2.y,34);
 drawCar(f.car,510);
 if(f.litter&&!f.carry)emo(f.litter.e,f.litter.x,f.litter.y,24);
 if(f.n){
  drawKandura(f.n.x,f.n.y,7);
  if(f.carry)emo('🥤',f.n.x+14,f.n.y-40,20);
  if(f.phase==='npc_go'||f.phase==='npc_pick')bubble(f.n.x,f.n.y-72,T('fn1'));
 }
 if(f.phase==='talk')bubble(p.x,p.y-64,f.tt<2.7?T('fp1'):T('fp2'));
}
function drawD(){
 const g=G,p=g.p,st=stageD(g),c=g.cine!=null?g.cine:(g.fin?30:null),u=c==null?0:clamp((c-8)/2,0,1);
 cx.clearRect(0,0,W,H);
 const gr=cx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#f6e3b4');gr.addColorStop(1,'#e2b874');
 cx.fillStyle=gr;cx.fillRect(0,0,W,H);
 cx.globalAlpha=1-u;
 if(g.pond){cx.fillStyle='#4fc3f7';cx.beginPath();cx.ellipse(POND.x,POND.y,60,30,0,0,Math.PI*2);cx.fill()}
 SP9.forEach((s,i)=>{
  const z=g.sap.find(v=>v.i===i);
  if(!z){ring(s.x,s.y,34,0,'#ffffff');return}
  if(!z.w){cx.globalAlpha=(1-u)*.35;emo('🌱',s.x,s.y,18);cx.globalAlpha=1-u;return}
  if(!z.gr){emo('🌱',s.x,s.y,26);return}
  if(s.k==='palm')palm(s.x,s.y);else grass(s.x,s.y);
 });
 tent(TENT.x,TENT.y);
 if(g.talk&&!g.well){cx.fillStyle='#3e2723';cx.beginPath();cx.ellipse(HOLE.x,HOLE.y,22,9,0,0,Math.PI*2);cx.fill();ring(HOLE.x,HOLE.y,45,g.dig,'#ffd166')}
 if(g.well)well(HOLE.x,HOLE.y);
 if(st===4&&!g.pond)ring(POND.x,POND.y,55,g.dig2,'#ffd166');
 if(st===1)arrow(GUIDE.x,GUIDE.y);
 if(st===2)arrow(HOLE.x,HOLE.y);
 if(st===4)arrow(POND.x,POND.y);
 drawFig(GUIDE.x,GUIDE.y,'#e67e22');label(T('guide'),GUIDE.x,GUIDE.y-48,'#5d4037',14);
 cx.globalAlpha=1;
 drawShop();
 const bt=[null,null,T('b2'),T('b3'),T('b4'),null][st];
 if(c==null&&g.talk&&!g.pond&&bt)bubble(GUIDE.x,GUIDE.y-48,bt);
 if(c==null){cx.fillStyle='rgba(0,0,0,.2)';cx.beginPath();cx.ellipse(p.x,p.y+26,16,6,0,0,Math.PI*2);cx.fill();drawPlayer(p);drawHeld(p);return}

 // city scene: cinematic (c = 0..24) and final state (c = 30)
 const ca=clamp(1-(c-7),0,1);
 cx.globalAlpha=u;cx.fillStyle='#b9c6cf';cx.fillRect(0,0,W,405);
 cx.fillStyle='#d8cfbd';cx.fillRect(0,405,W,48);
 cx.fillStyle='#8d959b';cx.fillRect(0,453,W,147);
 cx.fillStyle='#ffffff';for(let x=0;x<W;x+=60)cx.fillRect(x,540,30,4);
 cx.globalAlpha=1;
 BLDS.forEach(b=>{const f=clamp((c-b.t)/2.5,0,1),hh=b.h*f;if(hh<=0)return;cx.fillStyle='#e8dcc4';cx.fillRect(b.x,405-hh,b.w,hh);cx.fillStyle='#8a6d4b';for(let yy=405-hh+14;yy<397;yy+=24)cx.fillRect(b.x+8,yy,b.w-16,6)});
 cx.globalAlpha=ca;
 for(let i=0;i<6;i++){
  const a=i*Math.PI/3+.3,tx=p.x+46*Math.cos(a),ty=p.y+30*Math.sin(a),f=clamp((c-2-i*.15)/3,0,1);
  drawKandura(-50+(tx+50)*f,p.y+(ty-p.y)*f,i);
 }
 cx.globalAlpha=1;
 if(c>=8&&c<14)label(T('timepass'),480,40,'#3e2723',22);
 if(c>=19){cx.fillStyle='#5d4037';cx.fillRect(610,150,6,255)}
 if(c>=19){
  const fy=380-clamp((c-19)/3,0,1)*230;
  cx.fillStyle='#00732f';cx.fillRect(616,fy,90,20);cx.fillStyle='#ffffff';cx.fillRect(616,fy+20,90,20);cx.fillStyle='#000000';cx.fillRect(616,fy+40,90,20);cx.fillStyle='#ff0000';cx.fillRect(616,fy,28,60);
 }
 const bf=clamp((c-BURJ.t)/BURJ.dur,0,1),bh=BURJ.h*bf;
 if(bh>0){
  cx.fillStyle='#d8e3ea';cx.beginPath();cx.moveTo(BURJ.x,405);cx.lineTo(BURJ.x+BURJ.w,405);cx.lineTo(BURJ.x+BURJ.w*.62,405-bh);cx.lineTo(BURJ.x+BURJ.w*.38,405-bh);cx.closePath();cx.fill();
  cx.fillStyle='#9fb4c2';for(let yy=405-bh+18;yy<400;yy+=22)cx.fillRect(BURJ.x+BURJ.w*.3,yy,BURJ.w*.4,4);
  if(bf>=1){cx.fillStyle='#d8e3ea';cx.fillRect(BURJ.x+BURJ.w/2-2,405-BURJ.h-30,4,30)}
 }
 for(let i=0;i<15;i++){
  if(g.fin&&g.fin.n&&i===7)continue;
  const tx=70+i*58,ty=422,f=clamp((c-19-i*.05)/2.2,0,1);
  drawKandura(-60+(tx+60)*f,ty,i+6);
 }
 if(g.fin){drawFin();drawPlayer(p);return}
 if(ca>0)drawPlayer(p);
}

function drawKandura(x,y,i){
 const KAN=['#f5f5f0','#eee8d5','#e8e4da','#f8f8f4','#ece6d6','#f2efe6','#e9e3d0','#f7f5ee'];
 const GH=['#ffffff','#e6e0cf','#d9d2c0','#fbfbf7','#efe9da'];
 const kc=KAN[i%KAN.length],gc=GH[i%GH.length];
 cx.fillStyle=kc;cx.strokeStyle='#bdb6a3';cx.lineWidth=1;
 cx.beginPath();cx.moveTo(x-11,y-6);cx.lineTo(x+11,y-6);cx.lineTo(x+14,y+30);cx.lineTo(x-14,y+30);cx.closePath();cx.fill();cx.stroke();
 cx.fillStyle='#d9a877';cx.beginPath();cx.arc(x,y-18,9,0,Math.PI*2);cx.fill();
 cx.fillStyle=gc;cx.beginPath();cx.arc(x,y-20,11,Math.PI,0);cx.lineTo(x+11,y-12);cx.lineTo(x-11,y-12);cx.closePath();cx.fill();cx.stroke();
 cx.strokeStyle='#222';cx.lineWidth=2.5;cx.beginPath();cx.arc(x,y-22,9,Math.PI*1.05,Math.PI*1.95);cx.stroke();
}

// ---------- garden cinematic: five NPC houses rise around the new house ----------
function makeNpcs(){
 const S=[{x:200,y:70,w:80,h:64,t:0,wall:'#f5e6c8',roof:'#c0392b'},{x:420,y:60,w:84,h:70,t:1,wall:'#7fb3d5',roof:'#566573'},{x:600,y:72,w:76,h:60,t:2,wall:'#82e0aa',roof:'#117a65'},{x:40,y:300,w:72,h:66,t:3,wall:'#c39bd3',roof:'#6c3483'},{x:830,y:232,w:74,h:62,t:4,wall:'#f8c471',roof:'#a04000'}];
 const C=['#e67e22','#8e44ad','#2980b9','#27ae60','#c0392b'];
 return S.map((s,i)=>({h:s,d:i*.45,sx:rnd(120,840),sy:410,cloth:C[i]}));
}
function npcHouse(s,p){
 const {x,y,w,h,t,wall,roof}=s,by=y+h,wh=h*.6*Math.min(1,p*1.25);
 if(wh<=0)return;
 cx.fillStyle=wall;cx.fillRect(x,by-wh,w,wh);
 if(p>=.75){
  const k=Math.min(1,(p-.75)*4);
  cx.fillStyle=roof;cx.beginPath();
  if(t===0){cx.moveTo(x-6,by-wh);cx.lineTo(x+w/2,by-wh-h*.4*k);cx.lineTo(x+w+6,by-wh)}
  else if(t===1){cx.rect(x-6,by-wh-8*k,w+12,8*k)}
  else if(t===2){cx.arc(x+w/2,by-wh,w/2,Math.PI,0)}
  else if(t===3){cx.moveTo(x-4,by-wh);cx.lineTo(x+w/2,by-wh-h*.55*k);cx.lineTo(x+w+4,by-wh)}
  else{cx.moveTo(x-4,by-wh);cx.lineTo(x+w+4,by-wh-h*.35*k);cx.lineTo(x+w+4,by-wh)}
  cx.closePath();cx.fill();
 }
 if(p>=1){cx.fillStyle='#5d4037';cx.fillRect(x+w/2-6,by-22,12,22);cx.fillStyle='#d6f1ff';cx.fillRect(x+10,by-wh+12,12,10);cx.fillRect(x+w-22,by-wh+12,12,10)}
}
function drawNpcs(){
 const T0=G.cine==null?13:G.cine;
 G.npcs.forEach(n=>{
  const tl=T0-n.d;
  if(tl<0)return;
  const hs=n.h,bp=Math.min(1,Math.max(0,(tl-2.9)/6));
  npcHouse(hs,bp);
  const wt=Math.min(1,Math.max(0,(tl-.4)/2.5)),e=wt*wt*(3-2*wt);
  const x=n.sx+(hs.x+hs.w/2-n.sx)*e,y=n.sy+(hs.y+hs.h+14-n.sy)*e;
  cx.globalAlpha=Math.min(1,tl/.4);
  drawFig(x,y,n.cloth);
  if(tl>2.9&&tl<8.9)emo('🔨',x+16,y-34,18);
  cx.globalAlpha=1;
 });
}

// ---------- shared drawing helpers ----------
function emo(e,x,y,s){cx.font=s+'px "Segoe UI Emoji","Apple Color Emoji",Arial';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(e,x,y)}
function label(s,x,y,c,sz){cx.font='bold '+sz+'px Tajawal, Arial';cx.fillStyle=c;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(s,x,y)}
function ring(x,y,r,pr,col){
 cx.setLineDash([7,6]);cx.strokeStyle='#ffffff';cx.lineWidth=3;cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.stroke();cx.setLineDash([]);
 if(pr>0){cx.strokeStyle=col;cx.lineWidth=6;cx.beginPath();cx.arc(x,y,r,-Math.PI/2,-Math.PI/2+pr*Math.PI*2);cx.stroke()}
}
function arrow(x,y){const b=Math.sin(Date.now()/200)*6;cx.fillStyle='#ffd166';cx.beginPath();cx.moveTo(x-12,y-62+b);cx.lineTo(x+12,y-62+b);cx.lineTo(x,y-42+b);cx.closePath();cx.fill()}
function bubble(x,y,t){
 cx.font='bold 15px Tajawal, Arial';const w=Math.min(360,cx.measureText(t).width+24);
 cx.fillStyle='#ffffff';cx.strokeStyle='#8d6e63';cx.lineWidth=2;cx.beginPath();
 if(cx.roundRect)cx.roundRect(x-w/2,y-34,w,34,10);else cx.rect(x-w/2,y-34,w,34);
 cx.fill();cx.stroke();cx.fillStyle='#3e2723';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t,x,y-17);
}
function tree(x,y,s){cx.fillStyle='#6D4C41';cx.fillRect(x-6*s,y+8*s,12*s,28*s);cx.fillStyle='#2E7D32';[[0,0,30],[-18,10,22],[18,10,22]].forEach(([dx,dy,r])=>{cx.beginPath();cx.arc(x+dx*s,y+dy*s,r*s,0,Math.PI*2);cx.fill()})}
function palm(x,y){
 cx.fillStyle='#8d6e63';cx.fillRect(x-5,y-70,10,70);cx.fillStyle='#2e7d32';
 [[-40,-10],[40,-10],[-20,-30],[20,-30],[0,-40]].forEach(([dx,dy])=>{cx.beginPath();cx.ellipse(x+dx,y-70+dy,28,8,dx/60,0,Math.PI*2);cx.fill()});
 cx.fillStyle='#e67e22';[[-8,-62],[6,-60],[-2,-54]].forEach(([dx,dy])=>{cx.beginPath();cx.arc(x+dx,y+dy,3,0,Math.PI*2);cx.fill()});
}
function grass(x,y){cx.fillStyle='#7cb342';[-8,0,8].forEach(d=>{cx.beginPath();cx.moveTo(x+d-4,y);cx.lineTo(x+d,y-18);cx.lineTo(x+d+4,y);cx.fill()})}
function tent(x,y){
 cx.lineWidth=3;cx.strokeStyle='#4e342e';cx.fillStyle='#b5651d';
 cx.beginPath();cx.moveTo(x-100,y);cx.lineTo(x,y-100);cx.lineTo(x+100,y);cx.closePath();cx.fill();cx.stroke();
 cx.fillStyle='#fff3d6';cx.beginPath();cx.moveTo(x-22,y);cx.lineTo(x,y-50);cx.lineTo(x+22,y);cx.closePath();cx.fill();cx.stroke();
}
function well(x,y){cx.fillStyle='#8d6e63';cx.beginPath();cx.ellipse(x,y,28,12,0,0,Math.PI*2);cx.fill();cx.fillStyle='#4fc3f7';cx.beginPath();cx.ellipse(x,y,20,8,0,0,Math.PI*2);cx.fill()}
function drawFig(x,y,c){
 cx.fillStyle=c;cx.fillRect(x-12,y-8,24,30);
 cx.fillStyle='#d9a877';cx.beginPath();cx.arc(x,y-20,10,0,Math.PI*2);cx.fill();
 cx.fillStyle='#1a1a1a';cx.beginPath();cx.arc(x,y-20,11,Math.PI,0);cx.lineTo(x+10,y-23);cx.lineTo(x-10,y-23);cx.closePath();cx.fill();
}
function drawPlayer(p){
 const x=p.x,y=p.y;
 cx.fillStyle='#f5f5f0';cx.strokeStyle='#b0b0a8';cx.lineWidth=1.5;
 cx.beginPath();cx.moveTo(x-12,y-8);cx.lineTo(x+12,y-8);cx.lineTo(x+18,y+26);cx.lineTo(x-18,y+26);cx.closePath();cx.fill();cx.stroke();
 cx.beginPath();cx.moveTo(x,y-8);cx.lineTo(x,y+8);cx.stroke();
 cx.fillStyle='#d9a877';cx.beginPath();cx.arc(x,y-20,10,0,Math.PI*2);cx.fill();
 cx.fillStyle='#222';cx.beginPath();cx.arc(x-3.5,y-21,1.6,0,Math.PI*2);cx.arc(x+3.5,y-21,1.6,0,Math.PI*2);cx.fill();
 cx.fillStyle='#1a1a1a';cx.beginPath();cx.arc(x,y-20,11,Math.PI,0);cx.lineTo(x+10,y-23);cx.lineTo(x-10,y-23);cx.closePath();cx.fill();
}

// ---------- skip current task (not the whole stage, no points) ----------
function skipTask(){
 const g=G;
 if(!g||!running||g.cine!=null||g.walk)return;
 if(g.part===1){
  if(g.round===0){g.sorted=15;g.p.hold=[];g.items=[];g.round=1}
  else if(g.round===1){
   for(let j=0;j<6;j++)if(!g.sap.some(z=>z.i===j))g.sap.push({i:j,w:false,g:0,gr:false});
   g.round=2;
  }
  else if(g.round===2){g.sap.forEach(z=>{z.w=true;z.gr=true});g.round=3}
  else if(g.round===3&&g.built<1){g.built=1;g.cine=0;g.npcs=makeNpcs()}
 }
 else if(g.part===2){
  if(g.round===0){g.cleaned=g.need;g.p.hold=[];g.items=[];g.round=1}
  else if(g.round===1){
   const i=g.tr.findIndex(v=>!v);
   if(i>=0){g.tr[i]=true;g.fz=0;g.anims.push(makeAnim(i))}
  }
 }
 else if(g.part===3){
  if(g.round===0){g.cleaned=g.need;g.p.hold=[];g.items=[];g.round=1}
 }
 else if(g.fin){
  if(g.fin.phase==='stop'){g.fin.phase='npc_go';g.fin.tt=0;g.fin.n={x:476,y:422}}
 }
 else{
  const st=stageD(g);
  if(st===0){for(let i=0;i<9;i++)if(!g.sap.some(z=>z.i===i))g.sap.push({i,w:false,g:0,gr:false})}
  else if(st===1)g.talk=true;
  else if(st===2){g.well=true;g.dig=1}
  else if(st===3)g.sap.forEach(z=>{z.w=true});
  else if(st===4){g.dig2=1;g.pond=true;g.cine=0;g.cS={x:g.p.x,y:g.p.y};g.cT={x:TENT.x-150,y:TENT.y+15}}
 }
}

// ---------- HUD + loop ----------
function updateUI(){
 const g=G;
 $('pts').textContent=WAL.pts;$('tl').textContent=fmt(g.total);
 $('lives').textContent=g.part===1?'❤️'.repeat(3-g.strikes)+'🤍'.repeat(g.strikes):'❤️❤️❤️';
 let line='',icon='';
 if(g.part===1){
  $('lvl').textContent=g.round+1;
  const TK=[[T('g0'),g.sorted,15],[T('g1'),g.sap.length,6],[T('g2'),g.sap.filter(z=>z.gr).length,6],[T('g3'),Math.floor(g.built*100),100]][g.round];
  line=`${TK[0]} (${TK[1]}/${TK[2]})`;
  icon=g.round===0?(g.p.hold.length?'📥':'✋'):g.round===1?'🌱':g.round===2?'💧':'🔨';
 }else if(g.part===2){
  $('lvl').textContent=g.round+1;
  line=g.round===0?`${T('f0')} (${g.cleaned}/${g.need})`:`${T('f1')} (${g.tr.filter(Boolean).length}/9)`;
  icon=g.round===0?'🧹':'🌿';
 }else if(g.part===3){
  $('lvl').textContent=g.round+1;
  line=g.round===0?`${T('b0')} (${g.cleaned}/${g.need})`:T('b1');
  icon=g.round===0?'🧹':'🐟';
 }else if(g.fin){
  $('lvl').textContent=5;
  line=g.fin.phase==='stop'?T('fin'):'';
  icon='🚗';
 }else{
  const st=stageD(g);
  $('lvl').textContent=st+1;
  const TK=[[T('d0'),g.sap.length,9],[T('d1'),g.talk?1:0,1],[T('d2'),g.well?1:0,1],[T('d3'),g.sap.filter(z=>z.w).length,9],[T('d4'),g.pond?1:0,1]][Math.min(st,4)];
  line=`${TK[0]} (${TK[1]}/${TK[2]})`;
  icon=st===0?'🌱':st===1?'🗣️':'⛏️';
 }
 $('tasks').innerHTML=line?`<li>${line}</li>`:'';
 $('act').textContent=icon;
}
function loop(ts){
 const dt=Math.min(.05,(ts-last)/1000);last=ts;
 if(running&&G){
  const g=G;
  if(g.part===1){updateG(dt);drawG()}
  else if(g.part===2){updateF(dt);drawF()}
  else if(g.part===3){updateB(dt);drawB()}
  else{updateD(dt);drawD()}
  updateUI();
 }
 requestAnimationFrame(loop);
}
applyLang();
requestAnimationFrame(loop);
